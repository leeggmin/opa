name: OPA Frontend Access

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: opa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  pr-package-access:
    name: PR package access
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1차 PR 차단: 기준 브랜치의 정책/코드만 사용하고 PR의 코드는 절대 실행하지 않습니다.
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up OPA CLI
        uses: open-policy-agent/setup-opa@v2
        with:
          version: '1.10.1'

      - name: Test trusted Rego policies directly
        run: opa test policy/ -v

      - name: Collect trusted PR input
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .opa
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > .opa/pull.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > .opa/file-pages.json
          jq -en --slurpfile pull .opa/pull.json --slurpfile pages .opa/file-pages.json \
            --arg repository "$GH_REPO" --arg head "$PR_HEAD_SHA" --argjson number "$PR_NUMBER" '
            $pull[0] as $pr | ($pages[0] | add) as $files |
            if $pr.number == $number and $pr.base.repo.full_name == $repository and $pr.base.ref == "main"
              and $pr.head.sha == $head and ($head | length) > 0
              and ($pr.changed_files | type) == "number" and $pr.changed_files >= 1 and $pr.changed_files <= 3000
              and $pr.changed_files == ($pr.changed_files | floor)
              and ($files | length) == $pr.changed_files
              and ($files | map(.filename) | unique | length) == $pr.changed_files
            then {source: "github-api", actor: $pr.user.login, stage: "pr", changes: $files,
              revision: $head, pr_number: $number}
            else error("Invalid or incomplete PR metadata; refusing to authorize.") end
            ' > .opa/access-context.json

      # main 보호 규칙에서 'PR package access'를 필수 검사로 지정해야 병합이 실제 차단됩니다.
      - name: Evaluate PR access directly with OPA
        run: |
          opa eval --format pretty --input .opa/access-context.json --data policy/access.rego --data policy/members.json data.access
          opa eval --fail --format raw --input .opa/access-context.json --data policy/access.rego --data policy/members.json 'data.access.allow = true'

  frontend-deployment:
    name: Frontend deployment gate
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, opa-local]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      OPA_ACCESS_CONTEXT: .opa/access-context.json
    steps:
      - name: Check out exact deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up OPA CLI
        uses: open-policy-agent/setup-opa@v2
        with:
          version: '1.10.1'

      # 2차 배포 차단: 배포 SHA의 병합된 PR을 찾아 병합자가 아닌 원래 PR 작성자를 재검사합니다.
      # 직접 push나 불완전한 메타데이터는 빌드/배포 전에 차단합니다.
      - name: Collect trusted deployment input
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $associatedJson = gh api "repos/$env:GH_REPO/commits/$env:GITHUB_SHA/pulls?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $associated = $associatedJson | ConvertFrom-Json
          $merged = @($associated | Where-Object {
            $_.merged_at -and $_.merge_commit_sha -eq $env:GITHUB_SHA -and
            $_.base.repo.full_name -eq $env:GH_REPO -and $_.base.ref -eq 'main'
          })
          if ($merged.Count -ne 1) { throw 'Deployment requires exactly one merged PR; direct pushes are blocked.' }
          $number = $merged[0].number
          $pullJson = gh api "repos/$env:GH_REPO/pulls/$number"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pull = $pullJson | ConvertFrom-Json
          if ($pull.number -ne $number -or $pull.base.repo.full_name -ne $env:GH_REPO -or
              $pull.base.ref -ne 'main' -or -not $pull.merged_at -or $pull.merge_commit_sha -ne $env:GITHUB_SHA) {
            throw 'Merged PR provenance does not match the deployed commit.'
          }
          if (($pull.changed_files -isnot [int] -and $pull.changed_files -isnot [long]) -or
              $pull.changed_files -lt 1 -or $pull.changed_files -gt 3000) {
            throw 'Cannot safely inspect the entire PR file list (supported range: 1-3000).'
          }
          $pagesJson = gh api --paginate --slurp "repos/$env:GH_REPO/pulls/$number/files?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pages = $pagesJson | ConvertFrom-Json
          $changes = @($pages | ForEach-Object { $_ | ForEach-Object { $_ } })
          if ($changes.Count -ne $pull.changed_files -or
              @($changes.filename | Sort-Object -Unique -CaseSensitive).Count -ne $changes.Count) {
            throw 'Incomplete or duplicate changed-file metadata; refusing to authorize.'
          }
          $context = @{
            source = 'github-api'; actor = $pull.user.login; stage = 'deploy'; changes = $changes
            revision = $env:GITHUB_SHA; pr_number = $number
          }
          New-Item -ItemType Directory -Force .opa | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD $env:OPA_ACCESS_CONTEXT),
            ($context | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))

      - name: Evaluate deployment access directly with OPA
        run: |
          opa eval --format pretty --input $env:OPA_ACCESS_CONTEXT --data policy/access.rego --data policy/members.json data.access
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          opa eval --fail --format raw --input $env:OPA_ACCESS_CONTEXT --data policy/access.rego --data policy/members.json 'data.access.allow = true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Rego policies directly
        run: opa test policy/ -v

      - name: Check Docker settings directly with OPA
        run: |
          opa eval --format pretty --input deploy/development.json --data policy/deploy.rego data.deploy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          opa eval --fail --format raw --input deploy/development.json --data policy/deploy.rego 'data.deploy.allow = true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check denial examples directly with OPA
        run: |
          foreach ($example in @('deploy/denied-latest.json', 'deploy/denied-privileged.json')) {
            opa eval --fail --format raw --input $example --data policy/deploy.rego 'data.deploy.allow = false; some reason in data.deploy.deny'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and deploy the frontend on the local Docker host
        run: |
          $context = Get-Content $env:OPA_ACCESS_CONTEXT -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($context.source -ne 'github-api' -or $context.revision -ne $env:GITHUB_SHA -or $context.stage -ne 'deploy') {
            throw 'Deployment requires GitHub-derived input for the exact revision.'
          }
          opa eval --fail --format raw --input $env:OPA_ACCESS_CONTEXT --data policy/access.rego --data policy/members.json 'data.access.allow = true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deployment = Get-Content deploy/development.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $deployment | ConvertTo-Json -Depth 10 | opa eval --fail --format raw --stdin-input --data policy/deploy.rego 'data.deploy.allow = true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($platform -ne 'linux') { throw 'Docker Desktop must use the Linux container engine.' }
          $existingId = docker ps --all --filter "name=^/$($deployment.service)$" --format '{{.ID}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingId) {
            $labelsJson = docker inspect --format '{{json .Config.Labels}}' $existingId
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $labels = $labelsJson | ConvertFrom-Json
            if ($labels.'com.opa.lab' -ne 'local-cicd') { throw 'An unrelated container exists; it will not be removed.' }
          }
          docker build --tag $deployment.image .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingId) {
            docker rm --force $existingId
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $runArgs = @(
            'run', '--detach', '--name', $deployment.service,
            '--label', 'com.opa.lab=local-cicd',
            '--publish', "127.0.0.1:$($deployment.host_port):$($deployment.container_port)",
            '--user', "$($deployment.run_as_user):$($deployment.run_as_user)",
            '--memory', '128m', '--cpus', '0.5', '--pids-limit', '64',
            '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges:true',
            '--env', "APP_VERSION=$($deployment.image.Split(':')[1])", $deployment.image
          )
          docker @runArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deployment
        run: |
          $deployment = Get-Content deploy/development.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $url = "http://127.0.0.1:$($deployment.host_port)"
          curl.exe --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 30 "$url/health"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $health = Invoke-RestMethod "$url/health" -TimeoutSec 3
          $details = Invoke-RestMethod "$url/api/info" -TimeoutSec 3
          if ($health.status -ne 'ok' -or $details.service -ne $deployment.service -or
              $details.version -ne $deployment.image.Split(':')[1]) {
            throw 'The deployed application returned unexpected health or metadata.'
          }
          Write-Output "Healthy deployment: $url"
